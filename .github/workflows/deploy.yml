
name: Capstone CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GitHub workflow identity
        run: |                                       
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC request URL available: true"
          else
            echo "OIDC request URL available: false"
          fi

          
    
      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          url = request_url + "&audience=sts.amazonaws.com"
          request = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {request_token}"}
          )

          with urllib.request.urlopen(request) as response:
              oidc_token = json.load(response)["value"]

          payload = oidc_token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("iss", "aud", "sub", "repository", "ref", "event_name"):
              print(f"{key}: {claims.get(key)}")
          PY


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::317345516803:role/capstone-project-github-actions-role
          aws-region: af-south-1

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

        
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t capstone-web:${{ github.sha }} .

      - name: Tag and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: capstone-web
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag capstone-web:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          
      - name: Deploy Docker image to EC2 using SSM
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time

          region = "af-south-1"
          instance_id = "i-059fd089c2ed7d0c8"
          image = (
              "317345516803.dkr.ecr.af-south-1.amazonaws.com/"
              f"capstone-web:{os.environ['IMAGE_TAG']}"
          )

          commands = [
              "set -e",
              f"aws ecr get-login-password --region {region} | "
              "sudo docker login --username AWS --password-stdin "
              "317345516803.dkr.ecr.af-south-1.amazonaws.com",
              f"sudo docker pull {image}",
              "sudo docker stop capstone-web || true",
              "sudo docker rm capstone-web || true",
              f"sudo docker run -d --name capstone-web "
              f"--restart unless-stopped -p 80:80 {image}",
              "sleep 5",
              "curl --fail --silent --show-error http://localhost/health"
          ]

          result = subprocess.run(
              [
                  "aws", "ssm", "send-command",
                  "--instance-ids", instance_id,
                  "--document-name", "AWS-RunShellScript",
                  "--parameters", json.dumps({"commands": commands}),
                  "--query", "Command.CommandId",
                  "--output", "text"
              ],
              check=True,
              capture_output=True,
              text=True
          )

          command_id = result.stdout.strip()
          print(f"SSM deployment command: {command_id}", flush=True)

          for attempt in range(30):
              time.sleep(5)
              result = subprocess.run(
                  [
                      "aws", "ssm", "get-command-invocation",
                      "--command-id", command_id,
                      "--instance-id", instance_id,
                      "--output", "json"
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:
                  print("Waiting for SSM command invocation...", flush=True)
                  continue

              invocation = json.loads(result.stdout)
              status = invocation["Status"]

              if status == "Success":
                  print(invocation.get("StandardOutputContent", ""))
                  print("EC2 deployment succeeded!", flush=True)
                  sys.exit(0)

              if status in (
                  "Failed", "Cancelled", "TimedOut",
                  "Cancelling", "Undeliverable", "Terminated"
              ):
                  print(invocation.get("StandardErrorContent", ""))
                  print(f"Deployment failed: {status}", file=sys.stderr)
                  sys.exit(1)

              print(f"Deployment status: {status}", flush=True)

          print("Deployment timed out.", file=sys.stderr)
          sys.exit(1)
          PY


